services:
  # FastAPI backend — Phases 1-4. SQLite is a local file on this service's
  # ephemeral disk: it resets on redeploy/restart on Render's free tier,
  # which is fine for evaluation (the demo fixtures are always available).
  - type: web
    name: bugbusters-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://bugbusters-frontend.onrender.com
      # AI integration (LLM_ENABLED, LLM_PROVIDER, LLM_MODEL, LLM_API_KEY,
      # LLM_BASE_URL, and the LLM_MAX_* tuning vars) is intentionally left
      # unset here — set it in the Render dashboard if you want AI-assisted
      # investigation live on the deployed app. The app runs its fully
      # deterministic pipeline with zero AI config, same as local dev.

  # React/Vite frontend, served as a static site.
  - type: web
    name: bugbusters-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bugbusters-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
